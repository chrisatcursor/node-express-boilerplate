<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backend Observability</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
        color: #1f2937;
      }
      .status {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 0.8rem;
      }
      .loading {
        background: #f3f4f6;
        color: #374151;
      }
      .healthy {
        background: #dcfce7;
        color: #166534;
      }
      .error {
        background: #fee2e2;
        color: #991b1b;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 1rem;
        max-width: 560px;
      }
      dt {
        font-weight: 600;
      }
      dd {
        margin: 0.15rem 0 0.8rem;
      }
    </style>
  </head>
  <body>
    <h1>Backend observability</h1>
    <p>Auto-refreshes every 15s and when this tab regains focus.</p>
    <div class="card">
      <p>
        Status:
        <span id="status-pill" class="status loading">Loading</span>
      </p>
      <dl>
        <dt>Version</dt>
        <dd id="version">-</dd>
        <dt>Build ID</dt>
        <dd id="build-id">-</dd>
        <dt>Uptime</dt>
        <dd id="uptime">-</dd>
        <dt>Total requests</dt>
        <dd id="request-total">-</dd>
        <dt>Last error class</dt>
        <dd id="last-error">-</dd>
      </dl>
      <p id="message"></p>
    </div>
    <script src="/api/health/desktop/app.js"></script>
  </body>
</html>
